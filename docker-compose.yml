# Only needed if you set QDRANT_MODE=server in .env.
# The default (QDRANT_MODE=embedded) requires no Docker at all.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: dd-qdrant
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
